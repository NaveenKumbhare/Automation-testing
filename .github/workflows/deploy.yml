name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger

jobs:
  build:
    name: Test and Package Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.13.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp server.js sum.js deploy/
          cp package*.json deploy/
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Create SSH key file
          printf '%s\n' "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          trap 'rm -f private_key.pem' EXIT

          # Copy deployment package to EC2
          scp -i private_key.pem -o StrictHostKeyChecking=no \
            deploy.tar.gz ${EC2_USERNAME}@${EC2_HOST}:/tmp/

          # SSH into EC2 and deploy
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${EC2_USERNAME}@${EC2_HOST} << 'EOF'
            set -euo pipefail

            # Prepare the app directory before entering it
            sudo mkdir -p /var/www/express-app
            sudo chown -R "$USER:$USER" /var/www/express-app
            cd /var/www/express-app

            # Install the runtime and process manager if this is a fresh server
            if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nodejs npm
            fi
            if ! command -v curl >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y curl
            fi
            if ! sudo sh -c 'command -v pm2 >/dev/null 2>&1'; then
              sudo npm install --global pm2
            fi

            # Backup current version
            if [ -f "server.js" ]; then
              timestamp=$(date +%Y%m%d_%H%M%S)
              mkdir -p backups
              tar -czf "backups/backup_${timestamp}.tar.gz" server.js sum.js package.json package-lock.json
              # Keep only last 5 backups
              ls -t backups/backup_*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm
            fi
            
            # Extract new version (this will overwrite existing files)
            echo "Extracting new deployment package..."
            tar --overwrite -xzf /tmp/deploy.tar.gz -C /var/www/express-app
            rm /tmp/deploy.tar.gz

            # Fix ownership after extraction
            sudo chown -R $USER:$USER /var/www/express-app
            
            
            # Install production dependencies on the server
            echo ""
            echo "Installing production dependencies..."
            npm ci --omit=dev
            
            # Create .env file if needed (only on first deploy)
            if [ ! -f .env ]; then
              echo "Creating default .env file..."
              echo "NODE_ENV=production" > .env
              echo "PORT=8000" >> .env
            fi
            
            # Create logs directory
            mkdir -p logs
            
            # Replace any existing PM2 definition so it uses the deployed entry point
            if sudo pm2 describe express-app > /dev/null 2>&1; then
              sudo pm2 delete express-app
            fi
            sudo pm2 start /var/www/express-app/server.js \
              --name express-app --cwd /var/www/express-app

            # Save PM2 process list
            sudo pm2 save
           
          EOF

          # Cleanup
          rm private_key.pem

      - name: Verify application on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          trap 'rm -f private_key.pem' EXIT

          echo "Checking the app directly on EC2 over SSH..."
          for attempt in {1..12}; do
            if response=$(ssh -i private_key.pem -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 "${EC2_USERNAME}@${EC2_HOST}" \
              'curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/home'); then
              if [ "$response" = '{"msg":"i am root!"}' ]; then
                echo "✅ Deployment successful! /home returned the expected response."
                exit 0
              fi
              echo "Attempt $attempt returned an unexpected response: $response"
            else
              echo "Attempt $attempt: the app is not responding yet."
            fi

            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done

          echo "❌ The app did not return the expected response after 12 attempts."
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 "${EC2_USERNAME}@${EC2_HOST}" \
            'sudo pm2 status express-app; sudo pm2 logs express-app --lines 50 --nostream' || true
          exit 1

      - name: Rollback on failure
        if: failure()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "🔄 Attempting to rollback to previous version..."

          printf '%s\n' "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          trap 'rm -f private_key.pem' EXIT

          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${EC2_USERNAME}@${EC2_HOST} << 'EOF'
            set -euo pipefail

            cd /var/www/express-app

            sudo chown -R $USER:$USER /var/www/express-app

            latest_backup=$(ls -t backups/backup_*.tar.gz 2>/dev/null | head -1)
            
            if [ -n "$latest_backup" ]; then
              echo "Found backup: $latest_backup"
              tar -xzf "$latest_backup" -C /var/www/express-app
              npm ci --omit=dev
              if sudo pm2 describe express-app > /dev/null 2>&1; then
                sudo pm2 delete express-app
              fi
              sudo pm2 start /var/www/express-app/server.js \
                --name express-app --cwd /var/www/express-app
              sudo pm2 save
              echo "✅ Rolled back to previous version"
            else
              echo "⚠️ No backup found, cannot rollback"
            fi
          EOF